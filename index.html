<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bztami</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <header
      class="d-flex justify-content-between align-items-center p-2 bg-light shadow-sm"
    >
      <div class="logo d-flex align-items-center gap-3">
        <img
          src="images/wallet.png"
          alt="Wallet"
          class="img-fluid"
          style="max-width: 100px"
        />

        <div>
          <h1>
            <b><span class="text-primary fw-bold">B</span>aztami</b>
          </h1>
          <p>
            Manage Your <span class="text-primary fw-bold">Budget</span>, Grow
            Your <span class="text-primary fw-bold">Wealth</span>
          </p>
        </div>
      </div>

      <div class="header-actions">
        <a href="login.html" class="btn btn-outline-primary me-2">login</a>
        <a href="sign-up.html" class="btn btn-primary me-3">sign up</a>
        <button class="btn btn-outline-secondary ms-2">
          <i class="bi bi-search"></i>search
        </button>
      </div>
    </header>

    <section class="text-center py-3 text-white">
      <div class="container">
        <h3
          class="fw-bold d-inline-block px-3 py-2 bg-primary bg-opacity-10 rounded text-primary"
        >
          Prenez le contrôle de votre budget
        </h3>
        <p class="text-dark mb-0"><b>
          Suivez vos revenus et dépenses facilement, prenez des décisions
          intelligentes et atteignez vos objectifs financiers.</b>
        </p>
        <img src="images/telewallet.png" alt="baztami image" class="img-fluid float-start me-5" style="max-width: 200px;">
      </div>
    </section>

    <script type="text/javascript" src="script.js"></script>
  </body>
</html>
